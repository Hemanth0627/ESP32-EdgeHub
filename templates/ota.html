<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 EdgeHub OTA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #14213d;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .status {
            padding: 18px;
            border-radius: 12px;
            background: #f1f5f9;
            margin-bottom: 25px;
        }

        .status strong {
            display: block;
            margin-bottom: 8px;
        }

        input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            margin-bottom: 20px;
            background: #f8fafc;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-top: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 14px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: width 0.2s;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>ESP32 EdgeHub OTA Update</h1>

        <p class="subtitle">
            Upload a new ESP32 firmware binary safely through the EdgeHub backend.
        </p>

        <div class="status">
            <strong>OTA Instructions</strong>
            Select the compiled ESP32 <code>.bin</code> firmware file and upload it.
            Do not disconnect the ESP32 during the update.
        </div>

        <input
            type="file"
            id="firmware"
            accept=".bin"
        >

        <button id="uploadButton" onclick="uploadFirmware()">
            Upload Firmware
        </button>

        <div class="progress-container" id="progressContainer">

            <p id="progressText">
                Uploading firmware...
            </p>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

        </div>

        <div id="message" class="message"></div>

        <a href="/" class="back">
            ← Back to ESP32 EdgeHub Dashboard
        </a>

    </div>

</div>

<script>

async function uploadFirmware() {

    const fileInput = document.getElementById("firmware");
    const button = document.getElementById("uploadButton");
    const progressContainer = document.getElementById("progressContainer");
    const progress = document.getElementById("progress");
    const progressText = document.getElementById("progressText");
    const message = document.getElementById("message");

    message.style.display = "none";
    message.className = "message";

    if (!fileInput.files.length) {

        message.textContent = "Please select a firmware .bin file.";
        message.classList.add("error");
        message.style.display = "block";

        return;
    }

    const file = fileInput.files[0];

    if (!file.name.toLowerCase().endsWith(".bin")) {

        message.textContent = "Only .bin firmware files are allowed.";
        message.classList.add("error");
        message.style.display = "block";

        return;
    }

    const formData = new FormData();

    formData.append("firmware", file);

    button.disabled = true;
    button.textContent = "Uploading...";

    progressContainer.style.display = "block";
    progress.style.width = "0%";
    progressText.textContent = "Uploading firmware...";

    try {

        const xhr = new XMLHttpRequest();

        xhr.open("POST", "/api/ota", true);

        xhr.upload.addEventListener("progress", function(event) {

            if (event.lengthComputable) {

                const percent =
                    Math.round((event.loaded / event.total) * 100);

                progress.style.width = percent + "%";

                progressText.textContent =
                    "Uploading firmware... " + percent + "%";
            }

        });

        xhr.onload = function() {

            button.disabled = false;
            button.textContent = "Upload Firmware";

            try {

                const response = JSON.parse(xhr.responseText);

                if (xhr.status === 200 && response.success) {

                    progress.style.width = "100%";

                    progressText.textContent =
                        "Firmware uploaded successfully.";

                    message.textContent =
                        response.message ||
                        "OTA update completed successfully.";

                    message.classList.add("success");
                    message.style.display = "block";

                } else {

                    message.textContent =
                        response.message ||
                        response.error ||
                        "OTA update failed.";

                    message.classList.add("error");
                    message.style.display = "block";
                }

            } catch (error) {

                message.textContent =
                    "Unexpected response from the EdgeHub server.";

                message.classList.add("error");
                message.style.display = "block";
            }

        };

        xhr.onerror = function() {

            button.disabled = false;
            button.textContent = "Upload Firmware";

            message.textContent =
                "Could not connect to the EdgeHub backend.";

            message.classList.add("error");
            message.style.display = "block";
        };

        xhr.send(formData);

    } catch (error) {

        button.disabled = false;
        button.textContent = "Upload Firmware";

        message.textContent =
            "OTA upload failed: " + error.message;

        message.classList.add("error");
        message.style.display = "block";
    }

}

</script>

</body>
</html>
